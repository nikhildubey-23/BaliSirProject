{% extends "base.html" %}
{% block content %}

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h3 class="mb-0">Marine Insurance Renewal Form</h3>
          <small>Fill in the details below to renew your marine insurance policy</small>
        </div>
        <div class="card-body">
          <form id="marineRenewalForm">
            <div class="mb-3">
              <label for="policyNumber" class="form-label">Policy Number</label>
              <input type="text" class="form-control" id="policyNumber" name="policyNumber" required>
            </div>
            <div class="mb-3">
              <label for="insuredName" class="form-label">Insured Name</label>
              <input type="text" class="form-control" id="insuredName" name="insuredName" required>
            </div>
            <div class="mb-3">
              <label for="vesselName" class="form-label">Vessel Name</label>
              <input type="text" class="form-control" id="vesselName" name="vesselName" required>
            </div>
            <div class="mb-3">
              <label for="modeOfTransport" class="form-label">Mode of Transport</label>
              <select class="form-select" id="modeOfTransport" name="modeOfTransport" required>
                <option value="" selected disabled>Select</option>
                <option value="ship">Ship</option>
                <option value="cargo">Cargo</option>
                <option value="container">Container</option>
                <option value="air">Air Freight</option>
                <option value="rail">Rail</option>
                <option value="road">Road Transport</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Coverage Type</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="coverageType" id="annual" value="annual" required>
                <label class="form-check-label" for="annual">
                  Annual
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="coverageType" id="perCarryingUnit" value="perCarryingUnit" required>
                <label class="form-check-label" for="perCarryingUnit">
                  Per Carrying Unit
                </label>
              </div>
            </div>
            <div class="mb-3">
              <label for="sumInsured" class="form-label">Sum Insured (₹)</label>
              <input type="number" class="form-control" id="sumInsured" name="sumInsured" required>
            </div>
            <div class="mb-3">
              <label for="previousPolicyDocument" class="form-label">Previous Policy Document (Upload)</label>
              <input type="file" class="form-control" id="previousPolicyDocument" name="previousPolicyDocument" accept=".pdf,.jpg,.jpeg,.png" required>
              <small class="text-muted">PDF, JPG, JPEG, PNG files accepted</small>
            </div>
            <div class="mb-3">
              <label for="renewalDate" class="form-label">Renewal Date</label>
              <input type="date" class="form-control" id="renewalDate" name="renewalDate" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit Renewal</button>
          </form>
          <div id="form-message" class="mt-3 text-center"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('marineRenewalForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const form = event.target;
    const formData = new FormData(form);

    formData.append('to', 'sparksolutionfreelancing@gmail.com');
    formData.append('name', form.insuredName.value);
    formData.append('email', 'marineinsurance@bima.com');
    formData.append('subject', 'Marine Insurance Renewal - ' + form.policyNumber.value);

    let message = `Marine Insurance Renewal Form\n\n`;
    message += `Policy Number: ${form.policyNumber.value}\n`;
    message += `Insured Name: ${form.insuredName.value}\n`;
    message += `Vessel Name: ${form.vesselName.value}\n`;
    message += `Mode of Transport: ${form.modeOfTransport.value}\n`;
    message += `Coverage Type: ${form.coverageType.value === 'annual' ? 'Annual' : 'Per Carrying Unit'}\n`;
    message += `Sum Insured: ₹${form.sumInsured.value}\n`;
    message += `Renewal Date: ${form.renewalDate.value}\n`;

    formData.append('message', message);

    fetch('/send-email', {
      method: 'POST',
      body: formData,
    })
    .then(response => response.json())
    .then(data => {
      if (data.message) {
        document.getElementById('form-message').innerHTML = '<div class="alert alert-success">Renewal form submitted successfully! Our team will contact you shortly.</div>';
        form.reset();
      } else if (data.error) {
        document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + data.error + '</div>';
      }
    })
    .catch(error => {
      document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + error + '</div>';
    });
  });
</script>

{% endblock %}
