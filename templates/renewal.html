{% extends "base.html" %}

{% block extra_styles %}
<style>
  @media (max-width: 768px) {
    .renewal-title {
      font-size: 2rem !important;
    }
  }
</style>
{% endblock %}

{% block content %}

  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6 text-center text-md-start">
        <h2 class="renewal-heading renewal-title" style="font-weight:bold;font-size:3.5rem; color:black">
          “Secure your tomorrow renew with <em style="color:#f0ad00">Bima with Bali</em> and keep peace of mind just a click away”
        </h2>
      </div>
      <div class="col-md-6 text-center">
        <img src="{{ url_for('static', filename='image/re1.avif') }}" alt="Renewal" class="img-fluid" />
      </div>
    </div>
<section class="renewal-section py-5 px-5 my-3" style="border-radius:2rem; background-color: #d9a90f; width: 100%; display: flex; justify-content: center; align-items: center;">
    <form id="renewalForm" enctype="multipart/form-data">
      <div class="row mt-4 g-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label">First Name*</label>
          <input type="text" class="form-control" id="firstName" name="firstName" required>
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last Name*</label>
          <input type="text" class="form-control" id="lastName" name="lastName" required>
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email">
        </div>
        <div class="col-md-6">
          <label for="phone" class="form-label">Phone*</label>
          <input type="tel" class="form-control" id="phone" name="phone" required>
        </div>

        <div class="col-md-6">
          <label for="dateOfBirth" class="form-label">Date of Birth*</label>
          <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" required>
        </div>
        <div class="col-md-6">
          <label for="age" class="form-label">Age</label>
          <input type="text" class="form-control" id="age" name="age" readonly>
        </div>

        \<div class="col-md-6">
=======
          <label for="insuranceType" class="form-label">Insurance Type*</label>
          <select class="form-select" id="insuranceType" name="insuranceType" required>
            <option value="" selected disabled>Select Insurance Type</option>
            <option value="motor">Motor</option>
            <option value="health">Health</option>
            <option value="travel">Travel</option>
            <option value="marine">Marine</option>
            <option value="shopkeeper">Shopkeeper</option>
            <option value="workmen">Workmen Compensation</option>
            <option value="fire">Fire & Burglary</option>
            <option value="others">Others</option>
          </select>
        </div>

        <!-- Aadhaar Field - shown after insurance type selection -->
        <div class="col-md-6" id="aadhaarContainer" style="display: none;">
          <label for="aadhaar" class="form-label">Aadhaar Number</label>
          <input type="text" class="form-control" id="aadhaar" name="aadhaar" pattern="[0-9]{12}" maxlength="12" placeholder="Enter 12-digit Aadhaar number">
        </div>

        <!-- Dynamic Fields -->
        <div id="dynamicFields" class="col-12">
          <!-- Motor Fields -->
          <div id="motorFields" class="dynamic-group" style="display: none;">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="vehicleRC" class="form-label">Vehicle RC <small class="text-muted">(Max 5MB)</small></label>
                <input class="form-control" type="file" id="vehicleRC" name="vehicleRC" accept="image/*,application/pdf" data-max-size="5242880">
                <div class="invalid-feedback" id="vehicleRC-error"></div>
              </div>
              <div class="col-md-6">
                <label for="previousPolicyMotor" class="form-label">Previous Policy Copy <small class="text-muted">(Max 5MB)</small></label>
                <input class="form-control" type="file" id="previousPolicyMotor" name="previousPolicyMotor" accept="image/*,application/pdf" data-max-size="5242880">
                <div class="invalid-feedback" id="previousPolicyMotor-error"></div>
              </div>
            </div>
          </div>

          <!-- Health Fields -->
          <div id="healthFields" class="dynamic-group" style="display: none;">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="previousPolicyHealth" class="form-label">Previous Policy Copy <small class="text-muted">(Max 5MB)</small></label>
                <input class="form-control" type="file" id="previousPolicyHealth" name="previousPolicyHealth" accept="image/*,application/pdf" data-max-size="5242880">
                <div class="invalid-feedback" id="previousPolicyHealth-error"></div>
              </div>
              <div class="col-md-6">
                <label for="preExistingDisease" class="form-label">Pre-existing Disease</label>
                <input type="text" class="form-control" id="preExistingDisease" name="preExistingDisease">
              </div>
            </div>
          </div>

          <!-- Travel Fields -->
          <div id="travelFields" class="dynamic-group" style="display: none;">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="travelCountry" class="form-label">Country</label>
                <input type="text" class="form-control" id="travelCountry" name="travelCountry">
              </div>
              <div class="col-md-4">
                <label for="travelDuration" class="form-label">Duration (days)</label>
                <input type="number" class="form-control" id="travelDuration" name="travelDuration">
              </div>
              <div class="col-md-4">
                <label for="travelAge" class="form-label">Age</label>
                <input type="number" class="form-control" id="travelAge" name="travelAge">
              </div>
            </div>
          </div>

          <!-- Marine Fields -->
          <div id="marineFields" class="dynamic-group" style="display: none;">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="commodityType" class="form-label">Type of Commodity</label>
                <input type="text" class="form-control" id="commodityType" name="commodityType">
              </div>
              <div class="col-md-4">
                <label for="transportMode" class="form-label">Mode of Transport</label>
                <select class="form-select" id="transportMode" name="transportMode">
                  <option value="" selected disabled>Select Mode</option>
                  <option value="sea">Sea</option>
                  <option value="air">Air</option>
                  <option value="land">Land</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="preCarryingUnit" class="form-label">Pre-carrying Unit</label>
                <input type="text" class="form-control" id="preCarryingUnit" name="preCarryingUnit">
              </div>
            </div>
          </div>

          <!-- Shopkeeper Fields -->
          <div id="shopkeeperFields" class="dynamic-group" style="display: none;">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="businessNature" class="form-label">Nature of Business</label>
                <input type="text" class="form-control" id="businessNature" name="businessNature">
              </div>
              <div class="col-md-4">
                <label for="previousPolicyShopkeeper" class="form-label">Previous Policy Document <small class="text-muted">(Max 5MB)</small></label>
                <input class="form-control" type="file" id="previousPolicyShopkeeper" name="previousPolicyShopkeeper" accept="image/*,application/pdf" data-max-size="5242880">
                <div class="invalid-feedback" id="previousPolicyShopkeeper-error"></div>
              </div>
              <div class="col-md-4">
                <label for="claimOccurred" class="form-label">Claim Occurred</label>
                <select class="form-select" id="claimOccurred" name="claimOccurred">
                  <option value="" selected disabled>Select</option>
                  <option value="yes">Yes</option>
                  <option value="no">No</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Workmen Fields -->
          <div id="workmenFields" class="dynamic-group" style="display: none;">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="numberOfMembers" class="form-label">Number of Members</label>
                <input type="number" class="form-control" id="numberOfMembers" name="numberOfMembers">
              </div>
              <div class="col-md-4">
                <label for="salary" class="form-label">Salary</label>
                <input type="number" class="form-control" id="salary" name="salary">
              </div>
              <div class="col-md-4">
                <label for="workNature" class="form-label">Nature of Work</label>
                <input type="text" class="form-control" id="workNature" name="workNature">
              </div>
            </div>
          </div>

          <!-- Fire Fields -->
          <div id="fireFields" class="dynamic-group" style="display: none;">
            <div class="row g-3">
              <div class="col-md-3">
                <label for="sumInsured" class="form-label">Sum Insured</label>
                <input type="number" class="form-control" id="sumInsured" name="sumInsured">
              </div>
              <div class="col-md-3">
                <label for="locality" class="form-label">Locality</label>
                <input type="text" class="form-control" id="locality" name="locality">
              </div>
              <div class="col-md-3">
                <label for="pincode" class="form-label">Pincode</label>
                <input type="number" class="form-control" id="pincode" name="pincode">
              </div>
              <div class="col-md-3">
                <label for="occupancy" class="form-label">Occupancy</label>
                <input type="text" class="form-control" id="occupancy" name="occupancy">
              </div>
            </div>
          </div>

          <!-- Others Fields -->
          <div id="othersFields" class="dynamic-group" style="display: none;">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="typeOfInsurance" class="form-label">Type of Insurance</label>
                <input type="text" class="form-control" id="typeOfInsurance" name="typeOfInsurance">
              </div>
              <div class="col-md-6">
                <label for="previousPolicyOthers" class="form-label">Previous Policy Copy <small class="text-muted">(Max 5MB)</small></label>
                <input class="form-control" type="file" id="previousPolicyOthers" name="previousPolicyOthers" accept="image/*,application/pdf" data-max-size="5242880">
                <div class="invalid-feedback" id="previousPolicyOthers-error"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-dark w-100 rounded-pill">Submit</button>
        </div>
      </div>
    </form>
    <div id="form-message" class="mt-3 text-center"></div>
  </div>
</section>
<script>
  console.log('Script loaded');

  document.getElementById('insuranceType').addEventListener('change', function() {
    const selectedType = this.value;
    const groups = document.querySelectorAll('.dynamic-group');
    groups.forEach(group => group.style.display = 'none');

    // Show Aadhaar field when insurance type is selected
    const aadhaarContainer = document.getElementById('aadhaarContainer');
    if (selectedType) {
      aadhaarContainer.style.display = 'block';
      document.getElementById(selectedType + 'Fields').style.display = 'block';
    } else {
      aadhaarContainer.style.display = 'none';
    }
  });

  const renewalForm = document.getElementById('renewalForm');
  console.log('Form element:', renewalForm);

  // File size validation function
  function validateFileSize(input) {
    const maxSize = parseInt(input.getAttribute('data-max-size')) || 5242880; // 5MB default
    const file = input.files[0];
    
    if (file) {
      const fileSize = file.size;
      const errorElement = document.getElementById(input.id + '-error');
      
      if (fileSize > maxSize) {
        const maxSizeMB = Math.round(maxSize / 1024 / 1024);
        const actualSizeMB = Math.round(fileSize / 1024 / 1024);
        errorElement.textContent = `File size (${actualSizeMB}MB) exceeds maximum allowed size (${maxSizeMB}MB)`;
        input.classList.add('is-invalid');
        return false;
      } else {
        errorElement.textContent = '';
        input.classList.remove('is-invalid');
        return true;
      }
    }
    return true;
  }

  // Add file size validation to all file inputs
  const fileInputs = document.querySelectorAll('input[type="file"]');
  fileInputs.forEach(input => {
    input.addEventListener('change', function() {
      validateFileSize(this);
    });
  });

  renewalForm.addEventListener('submit', function(event) {
    console.log('Form submit event triggered');
    event.preventDefault();
    console.log('Default prevented');

    // Check if form is valid
    if (!renewalForm.checkValidity()) {
      console.log('Form is not valid');
      renewalForm.reportValidity();
      return;
    }

    // Check file sizes
    let fileSizeValid = true;
    const fileInputs = document.querySelectorAll('input[type="file"]');
    fileInputs.forEach(input => {
      if (!validateFileSize(input)) {
        fileSizeValid = false;
      }
    });

    if (!fileSizeValid) {
      console.log('File size validation failed');
      document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Please ensure all uploaded files are smaller than 5MB.</div>';
      return;
    }

    console.log('Form is valid, proceeding...');

    const submitButton = document.querySelector('#renewalForm button[type="submit"]');
    console.log('Submit button found:', submitButton);
    submitButton.disabled = true;
    submitButton.textContent = 'Sending...';
    console.log('Button disabled and text changed');

    const form = event.target;
    const formData = new FormData(form);

    // Log form data for debugging
    console.log('Form data entries:');
    for (let [key, value] of formData.entries()) {
      console.log(key, value);
    }

    formData.append('to', 'sparksolutionfreelancing@gmail.com');
    formData.append('name', form.firstName.value + ' ' + form.lastName.value);
    formData.append('email', form.email.value || 'renewal@bima.com');
    formData.append('subject', 'Renewal Form Submission - ' + form.insuranceType.value);

    let message = `Renewal Form Submission\n\n`;
    message += `First Name: ${form.firstName.value}\n`;
    message += `Last Name: ${form.lastName.value}\n`;
    message += `Email: ${form.email.value}\n`;
    message += `Phone: ${form.phone.value}\n`;
    message += `Date of Birth: ${form.dateOfBirth.value}\n`;
    message += `Insurance Type: ${form.insuranceType.value}\n`;
    message += `Aadhaar: ${form.aadhaar.value}\n`;

    // Add dynamic fields based on insurance type
    const insuranceType = form.insuranceType.value;
    if (insuranceType === 'motor') {
      message += `Vehicle RC: Attached\n`;
      message += `Previous Policy: Attached\n`;
    } else if (insuranceType === 'health') {
      message += `Previous Policy: Attached\n`;
      message += `Pre-existing Disease: ${form.preExistingDisease.value}\n`;
    } else if (insuranceType === 'travel') {
      message += `Country: ${form.travelCountry.value}\n`;
      message += `Duration: ${form.travelDuration.value} days\n`;
      message += `Age: ${form.travelAge.value}\n`;
    } else if (insuranceType === 'marine') {
      message += `Commodity Type: ${form.commodityType.value}\n`;
      message += `Transport Mode: ${form.transportMode.value}\n`;
      message += `Pre-carrying Unit: ${form.preCarryingUnit.value}\n`;
    } else if (insuranceType === 'shopkeeper') {
      message += `Nature of Business: ${form.businessNature.value}\n`;
      message += `Previous Policy: Attached\n`;
      message += `Claim Occurred: ${form.claimOccurred.value}\n`;
    } else if (insuranceType === 'workmen') {
      message += `Number of Members: ${form.numberOfMembers.value}\n`;
      message += `Salary: ${form.salary.value}\n`;
      message += `Nature of Work: ${form.workNature.value}\n`;
    } else if (insuranceType === 'fire') {
      message += `Sum Insured: ${form.sumInsured.value}\n`;
      message += `Locality: ${form.locality.value}\n`;
      message += `Pincode: ${form.pincode.value}\n`;
      message += `Occupancy: ${form.occupancy.value}\n`;
    } else if (insuranceType === 'others') {
      message += `Type of Insurance: ${form.typeOfInsurance.value}\n`;
      message += `Previous Policy: Attached\n`;
    }

    formData.append('message', message);

    console.log('About to fetch /send-email');
    fetch('/send-email', {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(response => {
      console.log('Response received, status:', response.status);
      console.log('Response headers:', response.headers);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      console.log('Response data:', data);
      const messageDiv = document.getElementById('form-message');
      if (data.message) {
        console.log('Success: showing success message');
        messageDiv.innerHTML = '<div class="alert alert-success">Renewal form submitted successfully! Our team will contact you shortly.</div>';
        form.reset();
        // Hide dynamic fields after reset
        document.querySelectorAll('.dynamic-group').forEach(group => group.style.display = 'none');
        document.getElementById('aadhaarContainer').style.display = 'none';
      } else if (data.error) {
        console.log('Error: showing error message');
        messageDiv.innerHTML = '<div class="alert alert-danger">Error: ' + data.error + '</div>';
      }
      console.log('Re-enabling submit button');
      submitButton.disabled = false;
      submitButton.textContent = 'Submit';
    })
    .catch(error => {
      console.error('Fetch error:', error);
      document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
      submitButton.disabled = false;
      submitButton.textContent = 'Submit';
    });
  });

  // Function to calculate age
  function calculateAge(dateOfBirth) {
    const today = new Date();
    const birthDate = new Date(dateOfBirth);
    let age = today.getFullYear() - birthDate.getFullYear();
    const month = today.getMonth() - birthDate.getMonth();
    if (month < 0 || (month === 0 && today.getDate() < birthDate.getDate())) {
      age--;
    }
    return age;
  }

  // Add event listener to date of birth input
  document.getElementById('dateOfBirth').addEventListener('change', function() {
    const dateOfBirth = this.value;
    const age = calculateAge(dateOfBirth);
    document.getElementById('age').value = age;
  });
</script>
{% endblock %}
