{% extends "admin/base.html" %}

{% block title %}Admin Login - Bima With Bali{% endblock %}

{% block login_content %}
<div class="container-fluid h-100">
    <div class="row h-100 justify-content-center align-items-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="fas fa-shield-alt fa-3x" style="color: #f0ad00;"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Admin Login</h2>
                        <p class="text-muted">Bima With Bali Insurance</p>
                    </div>
                    
                    <!-- Login Form -->
                    <form method="POST" action="{{ url_for('admin_login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control form-control-lg" id="username" 
                                       name="username" placeholder="Enter username" required autofocus>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control form-control-lg" id="password" 
                                       name="password" placeholder="Enter password" required>
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold" 
                                    style="background-color: #f0ad00; border: none;">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                        </div>
                    </form>
                    
                    <!-- Footer -->
                    <div class="text-center mt-4">
                        <p class="text-muted small">
                            <i class="fas fa-info-circle me-1"></i>
                            Admin access restricted to authorized personnel only
                        </p>
                    </div>
                </div>
            </div>
            
            <!-- Security Notice -->
            <div class="text-center mt-3">
                <div class="card border-0 bg-transparent">
                    <div class="card-body">
                        <small class="text-muted">
                            <i class="fas fa-shield-alt me-1"></i>
                            Secured with session-based authentication
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }
    
    .card {
        border-radius: 20px;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
    }
    
    .form-control:focus {
        border-color: #f0ad00;
        box-shadow: 0 0 0 0.2rem rgba(240, 173, 0, 0.25);
    }
    
    .btn-primary {
        transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(240, 173, 0, 0.4);
    }
    
    .input-group-text {
        background-color: #f8f9fa;
        border-color: #dee2e6;
    }
</style>
{% endblock %}
