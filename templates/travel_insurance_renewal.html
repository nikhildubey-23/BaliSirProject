{% extends "base.html" %}
{% block content %}

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-header bg-warning text-white text-center">
          <h3 class="mb-0">Travel Insurance Renewal Form</h3>
          <small>Fill in the details below to renew your travel insurance policy</small>
        </div>
        <div class="card-body">
          <form id="travelInsuranceRenewalForm">
            <div class="mb-3">
              <label for="customerName" class="form-label">Customer Name</label>
              <input type="text" class="form-control" id="customerName" name="customerName" required>
            </div>
            <div class="mb-3">
              <label for="age" class="form-label">Age</label>
              <input type="number" class="form-control" id="age" name="age" required>
            </div>
            <div class="mb-3">
              <label for="country" class="form-label">Country of Travel</label>
              <input type="text" class="form-control" id="country" name="country" required>
            </div>
            <div class="mb-3">
              <label for="duration" class="form-label">Duration (Days)</label>
              <input type="number" class="form-control" id="duration" name="duration" required>
            </div>
            <div class="mb-3">
              <label for="policyNumber" class="form-label">Policy Number</label>
              <input type="text" class="form-control" id="policyNumber" name="policyNumber" required>
            </div>
            <div class="mb-3">
              <label for="previousPolicyDocument" class="form-label">Previous Policy Document (Upload)</label>
              <input type="file" class="form-control" id="previousPolicyDocument" name="previousPolicyDocument" accept=".pdf,.jpg,.jpeg,.png" required>
              <small class="text-muted">PDF, JPG, JPEG, PNG files accepted</small>
            </div>
            <div class="mb-3">
              <label for="renewalDate" class="form-label">Renewal Date</label>
              <input type="date" class="form-control" id="renewalDate" name="renewalDate" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Submit Renewal</button>
          </form>
          <div id="form-message" class="mt-3 text-center"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('travelInsuranceRenewalForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const form = event.target;
    const formData = new FormData(form);

    formData.append('to', 'sparksolutionfreelancing@gmail.com');
    formData.append('name', form.customerName.value);
    formData.append('email', 'travelinsurance@bima.com');
    formData.append('subject', 'Travel Insurance Renewal - ' + form.policyNumber.value);

    let message = `Travel Insurance Renewal Form\n\n`;
    message += `Customer Name: ${form.customerName.value}\n`;
    message += `Age: ${form.age.value}\n`;
    message += `Country of Travel: ${form.country.value}\n`;
    message += `Duration (Days): ${form.duration.value}\n`;
    message += `Policy Number: ${form.policyNumber.value}\n`;
    message += `Renewal Date: ${form.renewalDate.value}\n`;

    formData.append('message', message);

    fetch('/send-email', {
      method: 'POST',
      body: formData,
    })
    .then(response => response.json())
    .then(data => {
      if (data.message) {
        document.getElementById('form-message').innerHTML = '<div class="alert alert-success">Renewal form submitted successfully! Our team will contact you shortly.</div>';
        form.reset();
      } else if (data.error) {
        document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + data.error + '</div>';
      }
    })
    .catch(error => {
      document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + error + '</div>';
    });
  });
</script>

{% endblock %}
