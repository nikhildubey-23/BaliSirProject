{% extends "base.html" %}
{% block content %}

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-header bg-info text-white text-center">
          <h3 class="mb-0">Shopkeeper Insurance Renewal Form</h3>
          <small>Fill in the details below to renew your shopkeeper insurance policy</small>
        </div>
        <div class="card-body">
          <form id="shopkeeperRenewalForm">
            <div class="mb-3">
              <label for="policyNumber" class="form-label">Policy Number</label>
              <input type="text" class="form-control" id="policyNumber" name="policyNumber" required>
            </div>
            <div class="mb-3">
              <label for="insuredName" class="form-label">Insured Name</label>
              <input type="text" class="form-control" id="insuredName" name="insuredName" required>
            </div>
            <div class="mb-3">
              <label for="businessAddress" class="form-label">Business Address</label>
              <textarea class="form-control" id="businessAddress" name="businessAddress" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label for="natureOfBusiness" class="form-label">Nature of Business</label>
              <select class="form-select" id="natureOfBusiness" name="natureOfBusiness" required>
                <option value="" selected disabled>Select</option>
                <option value="retail">Retail Shop</option>
                <option value="wholesale">Wholesale</option>
                <option value="restaurant">Restaurant/Cafe</option>
                <option value="pharmacy">Pharmacy</option>
                <option value="electronics">Electronics Store</option>
                <option value="clothing">Clothing Store</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="sumInsured" class="form-label">Sum Insured (₹)</label>
              <input type="number" class="form-control" id="sumInsured" name="sumInsured" required>
            </div>
            <div class="mb-3">
              <label for="claimOccurred" class="form-label">Has a claim occurred in the previous policy?</label>
              <select class="form-select" id="claimOccurred" name="claimOccurred" required onchange="toggleClaimDocument()">
                <option value="" selected disabled>Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>
            <div class="mb-3" id="claimDocumentDiv" style="display: none;">
              <label for="claimDocument" class="form-label">Previous Claim Document (Upload)</label>
              <input type="file" class="form-control" id="claimDocument" name="claimDocument" accept=".pdf,.jpg,.jpeg,.png">
              <small class="text-muted">PDF, JPG, JPEG, PNG files accepted</small>
            </div>
            <div class="mb-3">
              <label for="previousPolicyDocument" class="form-label">Previous Policy Document (Upload)</label>
              <input type="file" class="form-control" id="previousPolicyDocument" name="previousPolicyDocument" accept=".pdf,.jpg,.jpeg,.png" required>
              <small class="text-muted">PDF, JPG, JPEG, PNG files accepted</small>
            </div>
            <div class="mb-3">
              <label for="renewalDate" class="form-label">Renewal Date</label>
              <input type="date" class="form-control" id="renewalDate" name="renewalDate" required>
            </div>
            <button type="submit" class="btn btn-info w-100">Submit Renewal</button>
          </form>
          <div id="form-message" class="mt-3 text-center"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleClaimDocument() {
    const claimOccurred = document.getElementById('claimOccurred').value;
    const claimDocumentDiv = document.getElementById('claimDocumentDiv');
    const claimDocument = document.getElementById('claimDocument');

    if (claimOccurred === 'yes') {
      claimDocumentDiv.style.display = 'block';
      claimDocument.required = true;
    } else {
      claimDocumentDiv.style.display = 'none';
      claimDocument.required = false;
      claimDocument.value = '';
    }
  }

  document.getElementById('shopkeeperRenewalForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const form = event.target;
    const formData = new FormData(form);

    formData.append('to', 'sparksolutionfreelancing@gmail.com');
    formData.append('name', form.insuredName.value);
    formData.append('email', 'shopkeeperinsurance@bima.com');
    formData.append('subject', 'Shopkeeper Insurance Renewal - ' + form.policyNumber.value);

    let message = `Shopkeeper Insurance Renewal Form\n\n`;
    message += `Policy Number: ${form.policyNumber.value}\n`;
    message += `Insured Name: ${form.insuredName.value}\n`;
    message += `Business Address: ${form.businessAddress.value}\n`;
    message += `Nature of Business: ${form.natureOfBusiness.value}\n`;
    message += `Sum Insured: ₹${form.sumInsured.value}\n`;
    message += `Claim Occurred in Previous Policy: ${form.claimOccurred.value}\n`;
    message += `Renewal Date: ${form.renewalDate.value}\n`;

    formData.append('message', message);

    fetch('/send-email', {
      method: 'POST',
      body: formData,
    })
    .then(response => response.json())
    .then(data => {
      if (data.message) {
        document.getElementById('form-message').innerHTML = '<div class="alert alert-success">Renewal form submitted successfully! Our team will contact you shortly.</div>';
        form.reset();
        toggleClaimDocument();
      } else if (data.error) {
        document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + data.error + '</div>';
      }
    })
    .catch(error => {
      document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + error + '</div>';
    });
  });
</script>

{% endblock %}
