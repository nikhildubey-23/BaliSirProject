{% extends "base.html" %}
{% block content %}

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h3 class="mb-0">Burglary Insurance Renewal Form</h3>
          <small>Fill in the details below to renew your burglary insurance policy</small>
        </div>
        <div class="card-body">
          <form id="burglaryRenewalForm">
            <div class="mb-3">
              <label for="policyNumber" class="form-label">Policy Number</label>
              <input type="text" class="form-control" id="policyNumber" name="policyNumber" required>
            </div>
            <div class="mb-3">
              <label for="insuredName" class="form-label">Insured Name</label>
              <input type="text" class="form-control" id="insuredName" name="insuredName" required>
            </div>
            <div class="mb-3">
              <label for="propertyAddress" class="form-label">Property Address</label>
              <textarea class="form-control" id="propertyAddress" name="propertyAddress" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label for="locality" class="form-label">Locality</label>
              <input type="text" class="form-control" id="locality" name="locality" required>
            </div>
            <div class="mb-3">
              <label for="pincode" class="form-label">Pincode</label>
              <input type="text" class="form-control" id="pincode" name="pincode" pattern="[0-9]{6}" required>
            </div>
            <div class="mb-3">
              <label for="occupancy" class="form-label">Occupancy</label>
              <select class="form-select" id="occupancy" name="occupancy" required>
                <option value="" selected disabled>Select</option>
                <option value="residential">Residential</option>
                <option value="commercial">Commercial</option>
                <option value="industrial">Industrial</option>
                <option value="vacant">Vacant</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="sumInsured" class="form-label">Sum Insured (₹)</label>
              <input type="number" class="form-control" id="sumInsured" name="sumInsured" required>
            </div>
            <div class="mb-3">
              <label for="previousPolicyDocument" class="form-label">Previous Policy Document (Upload)</label>
              <input type="file" class="form-control" id="previousPolicyDocument" name="previousPolicyDocument" accept=".pdf,.jpg,.jpeg,.png" required>
              <small class="text-muted">PDF, JPG, JPEG, PNG files accepted</small>
            </div>
            <div class="mb-3">
              <label for="renewalDate" class="form-label">Renewal Date</label>
              <input type="date" class="form-control" id="renewalDate" name="renewalDate" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit Renewal</button>
          </form>
          <div id="form-message" class="mt-3 text-center"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('burglaryRenewalForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const form = event.target;
    const formData = new FormData(form);

    formData.append('to', 'sparksolutionfreelancing@gmail.com');
    formData.append('name', form.insuredName.value);
    formData.append('email', 'burglaryinsurance@bima.com');
    formData.append('subject', 'Burglary Insurance Renewal - ' + form.policyNumber.value);

    let message = `Burglary Insurance Renewal Form\n\n`;
    message += `Policy Number: ${form.policyNumber.value}\n`;
    message += `Insured Name: ${form.insuredName.value}\n`;
    message += `Property Address: ${form.propertyAddress.value}\n`;
    message += `Locality: ${form.locality.value}\n`;
    message += `Pincode: ${form.pincode.value}\n`;
    message += `Occupancy: ${form.occupancy.value}\n`;
    message += `Sum Insured: ₹${form.sumInsured.value}\n`;
    message += `Renewal Date: ${form.renewalDate.value}\n`;

    formData.append('message', message);

    fetch('/send-email', {
      method: 'POST',
      body: formData,
    })
    .then(response => response.json())
    .then(data => {
      if (data.message) {
        document.getElementById('form-message').innerHTML = '<div class="alert alert-success">Renewal form submitted successfully! Our team will contact you shortly.</div>';
        form.reset();
      } else if (data.error) {
        document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + data.error + '</div>';
      }
    })
    .catch(error => {
      document.getElementById('form-message').innerHTML = '<div class="alert alert-danger">Error: ' + error + '</div>';
    });
  });
</script>

{% endblock %}
